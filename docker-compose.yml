services:
  mysql:
    image: mysql:8.0
    container_name: ivolve-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ivolve-net

  auth-service:
    build: ./app/auth-service
    container_name: ivolve-auth
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ivolve-net

  roadmap-service:
    build: ./app/roadmap-service
    container_name: ivolve-roadmap
    networks:
      - ivolve-net

  frontend:
    build: ./app/frontend
    container_name: ivolve-frontend
    ports:
      - "3000:3000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:5000
      ROADMAP_SERVICE_URL: http://roadmap-service:8080
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      auth-service:
        condition: service_healthy
      roadmap-service:
        condition: service_started
    networks:
      - ivolve-net

volumes:
  mysql-data:

networks:
  ivolve-net:
    driver: bridge
