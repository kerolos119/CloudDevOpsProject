name: frontend

on:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/reusable-ci.yml"
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-ci.yml
    with:
      service: frontend
      manifest: k8s/22-frontend.yaml
