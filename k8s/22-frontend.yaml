apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ivolve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ivolve/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: ivolve-config, key: AUTH_SERVICE_URL }
            - name: ROADMAP_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: ivolve-config, key: ROADMAP_SERVICE_URL }
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: ivolve-secret, key: SESSION_SECRET }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ivolve
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
