- name: Install Docker
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true

- name: Start and enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: ansible_facts['service_mgr'] == 'systemd'

- name: Skip service management (no systemd on this host)
  ansible.builtin.debug:
    msg: "No systemd here (Floci container). Docker installed but service not started."
  when: ansible_facts['service_mgr'] != 'systemd'
