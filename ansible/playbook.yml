- name: Configure CI server
  hosts: ci_server
  gather_facts: false

  pre_tasks:
    - name: Make sure python is available on the target
      ansible.builtin.raw: >
        test -x /usr/bin/python3 -a -e /usr/lib/python3/dist-packages/apt ||
        (apt-get update && apt-get install -y python3 python3-apt)
      changed_when: false

    - name: Gather facts
      ansible.builtin.setup:

  roles:
    - java
    - docker
    - trivy
